
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عداد الاستغفار 🌿</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #245b40;
    }

    .container {
      background: white;
      padding: 40px 25px;
      border-radius: 25px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #698477;
      font-size: 15px;
      line-height: 1.8;
    }

    .dhikr {
      font-size: 24px;
      font-weight: bold;
      margin: 30px 0;
      line-height: 1.8;
    }

    .counter {
      width: 190px;
      height: 190px;
      margin: 25px auto;
      border-radius: 50%;
      border: 8px solid #a5d6a7;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f8f2;
    }

    #count {
      font-size: 65px;
      font-weight: bold;
      color: #2e7d32;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 15px;
      font-size: 18px;
      transition: 0.2s;
    }

    .add-btn {
      background: #388e3c;
      color: white;
      width: 100%;
      padding: 18px;
      font-weight: bold;
    }

    .add-btn:hover {
      background: #2e7d32;
    }

    .add-btn:active {
      transform: scale(0.97);
    }

    .reset-btn {
      margin-top: 15px;
      background: #edf5ee;
      color: #388e3c;
      padding: 12px 25px;
    }

    .progress {
      background: #e8f5e9;
      height: 12px;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 20px;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: #66bb6a;
      transition: width 0.3s;
    }

    .goal {
      margin-top: 12px;
      color: #698477;
      font-size: 14px;
    }

    .footer {
      margin-top: 30px;
      font-size: 13px;
      color: #8aa596;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🌿 عداد الاستغفار</h1>

    <p class="subtitle">
      اجعل الاستغفار جزءًا من يومك
    </p>

    <div class="dhikr">
      أستغفر الله العظيم وأتوب إليه
    </div>

    <div class="counter">
      <span id="count">0</span>
    </div>

    <button class="add-btn" onclick="addCount()">
      أستغفر الله 🤍
    </button>

    <button class="reset-btn" onclick="resetCount()">
      إعادة العداد ↺
    </button>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <p class="goal" id="goalText">
      0 من 100 استغفار
    </p>

    <p class="footer">
      🤍 لا تنسَ ذكر الله
    </p>

  </div>

  <script>
    const goal = 100;

    let count = Number(
      localStorage.getItem("istighfarCount")
    ) || 0;

    function updateUI() {
      document.getElementById("count").textContent = count;

      document.getElementById("goalText").textContent =
        count + " من " + goal + " استغفار";

      let progress = Math.min((count / goal) * 100, 100);

      document.getElementById("progressBar").style.width =
        progress + "%";
    }

    function addCount() {
      count++;
      localStorage.setItem("istighfarCount", count);
      updateUI();
    }

    function resetCount() {
      if (confirm("هل تريد تصفير العداد؟")) {
        count = 0;
        localStorage.setItem("istighfarCount", count);
        updateUI();
      }
    }

    updateUI();
  </script>

</body>
</html>
